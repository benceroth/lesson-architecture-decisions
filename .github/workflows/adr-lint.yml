name: ADR lint and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  adr-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint ADRs (fails if status, evidence, exit criteria or review date is missing)
        run: python tools/adr_lint.py adr
      - name: Prove the linter fails on the deliberately bad sample
        run: |
          if python tools/adr_lint.py tests/fixtures; then
            echo "Linter accepted the bad fixture" && exit 1
          fi
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Calculator tests
        run: node --test tests/tco.test.js
